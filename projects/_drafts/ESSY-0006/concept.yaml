{
  "workingTitle": "An Ordinary Life",
  "professionalFraming": "A first-person reflective video essay examining what it means to build an ordinary life — a career, a home, a family, savings, plans — while knowing that war could take all of it away. Through the narrator's own history, the essay moves from childhood fear of conscription, through the changed fear of middle age (not dying but living after the plan is destroyed), to the example of Ukraine as proof that ordinary life can continue under war as a condition, and ends with the question of whether the narrator's child will inherit the same fear.",
  "satiricalPremise": "We spend decades building as though permanence were guaranteed, while knowing all along that nothing we build is safe — and the hardest outcome to imagine is not dying but living to rebuild from nothing.",
  "learningObjective": "Viewers reflect on the fragility of the ordinary assumptions under their own plans, the difference between fearing death and fearing survival under destruction, and what it means to keep building anyway.",
  "summary": "The narrator grew up where the possibility of war was never abstract, feared military service as a young person, and learned to live with the possibility. Getting older changed the fear: now a life built over decades is what is threatened, and starting over no longer feels like an adventure. Looking at Ukraine, the narrator fears most not the moment war begins but everything after — ordinary life continuing under war as a condition. Work, savings, and preparation cannot make war impossible. If the narrator reaches eighty in peace, the summary of a fortunate life is simply an ordinary one — and the final question passes to the narrator's child and his children.",
  "centralLesson": "An ordinary life is not a small thing to hope for; the deepest fear is losing it, and the deepest fortune is being allowed to live it. We keep building not because we have solved the fear, but because building is what remains."
}
